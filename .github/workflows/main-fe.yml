# fe/ 가 바뀌면: 테스트·빌드가 통과해야 이미지를 만들어 ECR에 올린다
name: main-fe

on:
  push:
    branches: [main]
    paths:
      - "fe/**"
      - ".github/workflows/main-fe.yml"
  pull_request:
    paths:
      - "fe/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-fe-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: practice-board-web-fe   # k8s/30-web.yaml 의 image 이름과 맞춤

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # tsc 타입 검사 + vite 빌드

  build-and-push:
    needs: test
    # PR에서는 테스트만, main 반영 때만 이미지 push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # AWS OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: fe
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe
