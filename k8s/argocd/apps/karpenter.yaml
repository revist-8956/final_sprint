apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: default
spec:
  project: default
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.15.2
      helm:
        releaseName: karpenter
        valuesObject:
          replicas: 1
          settings:
            clusterName: final-sprint-cluster
    - repoURL: https://github.com/revist-8956/final_sprint.git
      targetRevision: main
      path: k8s/argocd/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
