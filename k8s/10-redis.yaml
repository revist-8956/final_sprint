apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-board-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: practice-board-redis
  template:
    metadata:
      labels:
        app: practice-board-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: practice-board-redis
spec:
  type: ClusterIP
  selector:
    app: practice-board-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
