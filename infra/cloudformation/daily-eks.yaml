AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Disposable EKS infrastructure for the observability lab. Requires bootstrap.yaml. Back up and delete PVC data BEFORE deleting this stack. Creation does not restore data.
Parameters:
  BootstrapStackName:
    Type: String
    Default: final-sprint-bootstrap
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9-]*"
    Description: Existing bootstrap stack in the same account and region.
  ClusterName:
    Type: String
    Default: final-sprint-cluster
    MinLength: 3
    MaxLength: 64
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_-]*"
    Description: Reuse this name between daily recreations.
  KubernetesVersion:
    Type: String
    AllowedPattern: '1\.[0-9]{2}'
    Default: 1.37
    Description: Required. Choose an EKS version currently in STANDARD support and reuse it for restore.
  ClusterAdminUserArn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:user/.+$"
    Description: First existing IAM user ARN to receive cluster admin access.
    Default: arn:aws:iam::410710358982:user/sprint_user01
  ClusterAdminUser2Arn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:user/.+$"
    Description: Second distinct existing IAM user ARN to receive cluster admin access.
    Default: arn:aws:iam::410710358982:user/sprint_user02
  ClusterAdminUser3Arn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:user/.+$"
    Description: Third distinct existing IAM user ARN to receive cluster admin access.
    Default: arn:aws:iam::410710358982:user/sprint_user03
  AdminPublicAccessCidr:
    Type: String
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:2[4-9]|3[0-2])$'
    Description: Administrator public egress IPv4 CIDR (/24 to /32, normally your VPN egress /32).
    Default: 58.235.174.52/32
  ObservabilityInstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.xlarge, m6i.xlarge]
  AppInstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, m6i.large]
  T3CpuCredits:
    Type: String
    Default: standard
    AllowedValues: [standard, unlimited]
    Description: Standard avoids Unlimited CPU surplus charges but throttles after credits run out.
  ObservabilityRootVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: OS/container root disk only. Observability PVC data uses separate CSI volumes.
  AppRootVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: OS/container root disk only. No application data disk is provisioned.
  NodeAmiReleaseVersion:
    Type: String
    Default: ""
    Description: Optional EKS AL2023 x86_64 release version. Empty selects an EKS-compatible default.
  VpcCniAddonVersion:
    Type: String
    Default: ""
  KubeProxyAddonVersion:
    Type: String
    Default: ""
  CoreDnsAddonVersion:
    Type: String
    Default: ""
  PodIdentityAgentAddonVersion:
    Type: String
    Default: ""
  EbsCsiAddonVersion:
    Type: String
    Default: ""
Rules:
  DistinctAdminUsers:
    Assertions:
      - Assert:
          !Not [!Equals [!Ref ClusterAdminUserArn, !Ref ClusterAdminUser2Arn]]
        AssertDescription: ClusterAdminUserArn and ClusterAdminUser2Arn must be different.
      - Assert:
          !Not [!Equals [!Ref ClusterAdminUserArn, !Ref ClusterAdminUser3Arn]]
        AssertDescription: ClusterAdminUserArn and ClusterAdminUser3Arn must be different.
      - Assert:
          !Not [!Equals [!Ref ClusterAdminUser2Arn, !Ref ClusterAdminUser3Arn]]
        AssertDescription: ClusterAdminUser2Arn and ClusterAdminUser3Arn must be different.
Conditions:
  IsObservabilityT3: !Equals [!Ref ObservabilityInstanceType, t3.xlarge]
  IsAppT3: !Equals [!Ref AppInstanceType, t3.large]
  HasNodeAmiRelease: !Not [!Equals [!Ref NodeAmiReleaseVersion, ""]]
  HasVpcCniVersion: !Not [!Equals [!Ref VpcCniAddonVersion, ""]]
  HasKubeProxyVersion: !Not [!Equals [!Ref KubeProxyAddonVersion, ""]]
  HasCoreDnsVersion: !Not [!Equals [!Ref CoreDnsAddonVersion, ""]]
  HasPodIdentityAgentVersion:
    !Not [!Equals [!Ref PodIdentityAgentAddonVersion, ""]]
  HasEbsCsiVersion: !Not [!Equals [!Ref EbsCsiAddonVersion, ""]]
Resources:
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: LabCluster, Value: !Ref ClusterName }
        - { Key: Lifecycle, Value: daily }
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      ConnectivityType: public
      AvailabilityMode: zonal
      SubnetId:
        Fn::ImportValue: !Sub "${BootstrapStackName}-PublicSubnetAId"
      Tags:
        - { Key: Name, Value: !Sub "${ClusterName}-nat" }
        - { Key: Lifecycle, Value: daily }
  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${BootstrapStackName}-PrivateRouteTableAId"
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${BootstrapStackName}-PrivateRouteTableBId"
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn:
        Fn::ImportValue: !Sub "${BootstrapStackName}-ClusterRoleArn"
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: false
      BootstrapSelfManagedAddons: true
      UpgradePolicy:
        SupportType: STANDARD
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: [!Ref AdminPublicAccessCidr]
        SubnetIds:
          - Fn::ImportValue: !Sub "${BootstrapStackName}-PrivateSubnetAId"
          - Fn::ImportValue: !Sub "${BootstrapStackName}-PrivateSubnetBId"
      Tags:
        - Key: Project
          Value:
            Fn::ImportValue: !Sub "${BootstrapStackName}-ProjectName"
        - { Key: Lifecycle, Value: daily }
  ClusterAdminAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref ClusterAdminUserArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          AccessScope: { Type: cluster }
  ClusterAdminUser2Access:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref ClusterAdminUser2Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          AccessScope: { Type: cluster }
  ClusterAdminUser3Access:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref ClusterAdminUser3Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          AccessScope: { Type: cluster }
  RootClusterAdminAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          AccessScope: { Type: cluster }
  ObservabilityLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # Managed node groups supply the AMI, instance profile and cluster SG.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        CreditSpecification: !If
          - IsObservabilityT3
          - { CpuCredits: !Ref T3CpuCredits }
          - !Ref AWS::NoValue
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref ObservabilityRootVolumeGiB
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${ClusterName}-observability" }
              - { Key: LabCluster, Value: !Ref ClusterName }
              - { Key: Workload, Value: observability }
          - ResourceType: volume
            Tags:
              - { Key: LabCluster, Value: !Ref ClusterName }
              - { Key: DiskPurpose, Value: node-root }
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        CreditSpecification: !If
          - IsAppT3
          - { CpuCredits: !Ref T3CpuCredits }
          - !Ref AWS::NoValue
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref AppRootVolumeGiB
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${ClusterName}-app" }
              - { Key: LabCluster, Value: !Ref ClusterName }
              - { Key: Workload, Value: app }
          - ResourceType: volume
            Tags:
              - { Key: LabCluster, Value: !Ref ClusterName }
              - { Key: DiskPurpose, Value: node-root }
  ObservabilityNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: [PrivateDefaultRouteA, PrivateDefaultRouteB]
    Properties:
      ClusterName: !Ref Cluster
      NodeRole:
        Fn::ImportValue: !Sub "${BootstrapStackName}-NodeRoleArn"
      Subnets:
        - Fn::ImportValue: !Sub "${BootstrapStackName}-PrivateSubnetAId"
      InstanceTypes: [!Ref ObservabilityInstanceType]
      AmiType: AL2023_x86_64_STANDARD
      Version: !Ref KubernetesVersion
      ReleaseVersion:
        !If [HasNodeAmiRelease, !Ref NodeAmiReleaseVersion, !Ref "AWS::NoValue"]
      CapacityType: ON_DEMAND
      LaunchTemplate:
        Id: !Ref ObservabilityLaunchTemplate
        Version: !GetAtt ObservabilityLaunchTemplate.LatestVersionNumber
      ScalingConfig: { MinSize: 1, DesiredSize: 1, MaxSize: 1 }
      # MINIMAL avoids the normal update surge, but interrupts this single-node role.
      UpdateConfig: { MaxUnavailable: 1, UpdateStrategy: MINIMAL }
      Labels: { workload: observability }
      Taints:
        - { Key: dedicated, Value: observability, Effect: NO_SCHEDULE }
      Tags:
        Lifecycle: daily
  AppNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: [PrivateDefaultRouteA, PrivateDefaultRouteB]
    Properties:
      ClusterName: !Ref Cluster
      NodeRole:
        Fn::ImportValue: !Sub "${BootstrapStackName}-NodeRoleArn"
      Subnets:
        - Fn::ImportValue: !Sub "${BootstrapStackName}-PrivateSubnetAId"
      InstanceTypes: [!Ref AppInstanceType]
      AmiType: AL2023_x86_64_STANDARD
      Version: !Ref KubernetesVersion
      ReleaseVersion:
        !If [HasNodeAmiRelease, !Ref NodeAmiReleaseVersion, !Ref "AWS::NoValue"]
      CapacityType: ON_DEMAND
      LaunchTemplate:
        Id: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      ScalingConfig: { MinSize: 1, DesiredSize: 1, MaxSize: 1 }
      UpdateConfig: { MaxUnavailable: 1, UpdateStrategy: MINIMAL }
      Labels: { workload: app }
      Tags:
        Lifecycle: daily
  VpcCniAddon:
    Type: AWS::EKS::Addon
    DependsOn: [AppNodeGroup, ObservabilityNodeGroup]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      AddonVersion:
        !If [HasVpcCniVersion, !Ref VpcCniAddonVersion, !Ref "AWS::NoValue"]
      ResolveConflicts: OVERWRITE
      PreserveOnDelete: false
  KubeProxyAddon:
    Type: AWS::EKS::Addon
    DependsOn: [AppNodeGroup, ObservabilityNodeGroup]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: kube-proxy
      AddonVersion:
        !If [
          HasKubeProxyVersion,
          !Ref KubeProxyAddonVersion,
          !Ref "AWS::NoValue",
        ]
      ResolveConflicts: OVERWRITE
      PreserveOnDelete: false
  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: [AppNodeGroup, ObservabilityNodeGroup]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: coredns
      AddonVersion:
        !If [HasCoreDnsVersion, !Ref CoreDnsAddonVersion, !Ref "AWS::NoValue"]
      ResolveConflicts: OVERWRITE
      PreserveOnDelete: false
  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    DependsOn: [AppNodeGroup, ObservabilityNodeGroup]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      AddonVersion:
        !If [
          HasPodIdentityAgentVersion,
          !Ref PodIdentityAgentAddonVersion,
          !Ref "AWS::NoValue",
        ]
      ResolveConflicts: OVERWRITE
      PreserveOnDelete: false
  EbsCsiAddon:
    Type: AWS::EKS::Addon
    DependsOn:
      [PodIdentityAgentAddon, VpcCniAddon, KubeProxyAddon, CoreDnsAddon]
    Properties:
      ClusterName: !Ref Cluster
      AddonName: aws-ebs-csi-driver
      AddonVersion:
        !If [HasEbsCsiVersion, !Ref EbsCsiAddonVersion, !Ref "AWS::NoValue"]
      ResolveConflicts: OVERWRITE
      PreserveOnDelete: false
      PodIdentityAssociations:
        - ServiceAccount: ebs-csi-controller-sa
          RoleArn:
            Fn::ImportValue: !Sub "${BootstrapStackName}-EbsCsiRoleArn"
  KarpenterNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: !Sub "ec2.${AWS::URLSuffix}" }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly"
        # Match the existing managed-node CNI bootstrap pattern.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
  KarpenterNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ClusterName}-karpenter"
      Roles: [!Ref KarpenterNodeRole]
  KarpenterNodeAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !GetAtt KarpenterNodeRole.Arn
      Type: EC2_LINUX
  KarpenterNodeLifecyclePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Upstream Karpenter v1.15.2 policy. JSON enables cluster-scoped tag keys.
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowScopedEC2InstanceAccessActions",
              "Effect": "Allow",
              "Resource": [
                "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:security-group/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:subnet/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:capacity-reservation/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:placement-group/*"
              ],
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet"
              ]
            },
            {
              "Sid": "AllowScopedEC2LaunchTemplateAccessActions",
              "Effect": "Allow",
              "Resource": "arn:${AWS::Partition}:ec2:${AWS::Region}:*:launch-template/*",
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${ClusterName}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedEC2InstanceActionsWithTags",
              "Effect": "Allow",
              "Resource": [
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:fleet/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:instance/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:volume/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:network-interface/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:launch-template/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:spot-instances-request/*"
              ],
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet",
                "ec2:CreateLaunchTemplate"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${ClusterName}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${ClusterName}"
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedResourceCreationTagging",
              "Effect": "Allow",
              "Resource": [
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:fleet/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:instance/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:volume/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:network-interface/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:launch-template/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:spot-instances-request/*"
              ],
              "Action": "ec2:CreateTags",
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${ClusterName}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${ClusterName}",
                  "ec2:CreateAction": [
                    "RunInstances",
                    "CreateFleet",
                    "CreateLaunchTemplate"
                  ]
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedResourceTagging",
              "Effect": "Allow",
              "Resource": "arn:${AWS::Partition}:ec2:${AWS::Region}:*:instance/*",
              "Action": "ec2:CreateTags",
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${ClusterName}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                },
                "StringEqualsIfExists": {
                  "aws:RequestTag/eks:eks-cluster-name": "${ClusterName}"
                },
                "ForAllValues:StringEquals": {
                  "aws:TagKeys": [
                    "eks:eks-cluster-name",
                    "karpenter.sh/nodeclaim",
                    "Name"
                  ]
                }
              }
            },
            {
              "Sid": "AllowScopedDeletion",
              "Effect": "Allow",
              "Resource": [
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:instance/*",
                "arn:${AWS::Partition}:ec2:${AWS::Region}:*:launch-template/*"
              ],
              "Action": [
                "ec2:TerminateInstances",
                "ec2:RebootInstances",
                "ec2:DeleteLaunchTemplate"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${ClusterName}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                }
              }
            }
          ]
        }
  KarpenterResourceDiscoveryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Upstream Karpenter v1.15.2 policy. JSON enables cluster-scoped tag keys.
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowRegionalReadActions",
              "Effect": "Allow",
              "Resource": "*",
              "Action": [
                "ec2:DescribeCapacityReservations",
                "ec2:DescribeImages",
                "ec2:DescribeInstances",
                "ec2:DescribeInstanceStatus",
                "ec2:DescribeInstanceTypeOfferings",
                "ec2:DescribeInstanceTypes",
                "ec2:DescribeLaunchTemplates",
                "ec2:DescribePlacementGroups",
                "ec2:DescribeSecurityGroups",
                "ec2:DescribeSpotPriceHistory",
                "ec2:DescribeSubnets"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": "${AWS::Region}"
                }
              }
            },
            {
              "Sid": "AllowSSMReadActions",
              "Effect": "Allow",
              "Resource": "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*",
              "Action": "ssm:GetParameter"
            },
            {
              "Sid": "AllowPricingReadActions",
              "Effect": "Allow",
              "Resource": "*",
              "Action": "pricing:GetProducts"
            },
            {
              "Sid": "AllowUnscopedInstanceProfileListAction",
              "Effect": "Allow",
              "Resource": "*",
              "Action": "iam:ListInstanceProfiles"
            },
            {
              "Sid": "AllowInstanceProfileReadActions",
              "Effect": "Allow",
              "Resource": "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*",
              "Action": "iam:GetInstanceProfile"
            }
          ]
        }
  KarpenterEksIntegrationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Upstream Karpenter v1.15.2 policy. JSON enables cluster-scoped tag keys.
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAPIServerEndpointDiscovery",
              "Effect": "Allow",
              "Resource": "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}",
              "Action": "eks:DescribeCluster"
            }
          ]
        }
  KarpenterControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: pods.eks.amazonaws.com }
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/eks-cluster-name: !Ref ClusterName
                aws:RequestTag/kubernetes-namespace: karpenter
                aws:RequestTag/kubernetes-service-account: karpenter
      ManagedPolicyArns:
        - !Ref KarpenterNodeLifecyclePolicy
        - !Ref KarpenterResourceDiscoveryPolicy
        - !Ref KarpenterEksIntegrationPolicy
      Policies:
        - PolicyName: PassKarpenterNodeRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt KarpenterNodeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: !Sub "ec2.${AWS::URLSuffix}"
  KarpenterPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref Cluster
      Namespace: karpenter
      ServiceAccount: karpenter
      RoleArn: !GetAtt KarpenterControllerRole.Arn
  LoadBalancerControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: AWS Load Balancer Controller v2.14.0 upstream IAM policy
      # Source: https://github.com/kubernetes-sigs/aws-load-balancer-controller/blob/v2.14.0/docs/install/iam_policy.json
      # Only ARN partition literals are parameterized; retain upstream tag conditions.
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "iam:CreateServiceLinkedRole"
              ],
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "iam:AWSServiceName": "elasticloadbalancing.amazonaws.com"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:DescribeAccountAttributes",
                "ec2:DescribeAddresses",
                "ec2:DescribeAvailabilityZones",
                "ec2:DescribeInternetGateways",
                "ec2:DescribeVpcs",
                "ec2:DescribeVpcPeeringConnections",
                "ec2:DescribeSubnets",
                "ec2:DescribeSecurityGroups",
                "ec2:DescribeInstances",
                "ec2:DescribeNetworkInterfaces",
                "ec2:DescribeTags",
                "ec2:GetCoipPoolUsage",
                "ec2:DescribeCoipPools",
                "ec2:GetSecurityGroupsForVpc",
                "ec2:DescribeIpamPools",
                "ec2:DescribeRouteTables",
                "elasticloadbalancing:DescribeLoadBalancers",
                "elasticloadbalancing:DescribeLoadBalancerAttributes",
                "elasticloadbalancing:DescribeListeners",
                "elasticloadbalancing:DescribeListenerCertificates",
                "elasticloadbalancing:DescribeSSLPolicies",
                "elasticloadbalancing:DescribeRules",
                "elasticloadbalancing:DescribeTargetGroups",
                "elasticloadbalancing:DescribeTargetGroupAttributes",
                "elasticloadbalancing:DescribeTargetHealth",
                "elasticloadbalancing:DescribeTags",
                "elasticloadbalancing:DescribeTrustStores",
                "elasticloadbalancing:DescribeListenerAttributes",
                "elasticloadbalancing:DescribeCapacityReservation"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "cognito-idp:DescribeUserPoolClient",
                "acm:ListCertificates",
                "acm:DescribeCertificate",
                "iam:ListServerCertificates",
                "iam:GetServerCertificate",
                "waf-regional:GetWebACL",
                "waf-regional:GetWebACLForResource",
                "waf-regional:AssociateWebACL",
                "waf-regional:DisassociateWebACL",
                "wafv2:GetWebACL",
                "wafv2:GetWebACLForResource",
                "wafv2:AssociateWebACL",
                "wafv2:DisassociateWebACL",
                "shield:GetSubscriptionState",
                "shield:DescribeProtection",
                "shield:CreateProtection",
                "shield:DeleteProtection"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:AuthorizeSecurityGroupIngress",
                "ec2:RevokeSecurityGroupIngress"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:CreateSecurityGroup"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:CreateTags"
              ],
              "Resource": "arn:${AWS::Partition}:ec2:*:*:security-group/*",
              "Condition": {
                "StringEquals": {
                  "ec2:CreateAction": "CreateSecurityGroup"
                },
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:CreateTags",
                "ec2:DeleteTags"
              ],
              "Resource": "arn:${AWS::Partition}:ec2:*:*:security-group/*",
              "Condition": {
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "true",
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:AuthorizeSecurityGroupIngress",
                "ec2:RevokeSecurityGroupIngress",
                "ec2:DeleteSecurityGroup"
              ],
              "Resource": "*",
              "Condition": {
                "Null": {
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:CreateLoadBalancer",
                "elasticloadbalancing:CreateTargetGroup"
              ],
              "Resource": "*",
              "Condition": {
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:CreateListener",
                "elasticloadbalancing:DeleteListener",
                "elasticloadbalancing:CreateRule",
                "elasticloadbalancing:DeleteRule"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:AddTags",
                "elasticloadbalancing:RemoveTags"
              ],
              "Resource": [
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:targetgroup/*/*",
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:loadbalancer/net/*/*",
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:loadbalancer/app/*/*"
              ],
              "Condition": {
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "true",
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:AddTags",
                "elasticloadbalancing:RemoveTags"
              ],
              "Resource": [
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:listener/net/*/*/*",
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:listener/app/*/*/*",
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:listener-rule/net/*/*/*",
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:listener-rule/app/*/*/*"
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:ModifyLoadBalancerAttributes",
                "elasticloadbalancing:SetIpAddressType",
                "elasticloadbalancing:SetSecurityGroups",
                "elasticloadbalancing:SetSubnets",
                "elasticloadbalancing:DeleteLoadBalancer",
                "elasticloadbalancing:ModifyTargetGroup",
                "elasticloadbalancing:ModifyTargetGroupAttributes",
                "elasticloadbalancing:DeleteTargetGroup",
                "elasticloadbalancing:ModifyListenerAttributes",
                "elasticloadbalancing:ModifyCapacityReservation",
                "elasticloadbalancing:ModifyIpPools"
              ],
              "Resource": "*",
              "Condition": {
                "Null": {
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:AddTags"
              ],
              "Resource": [
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:targetgroup/*/*",
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:loadbalancer/net/*/*",
                "arn:${AWS::Partition}:elasticloadbalancing:*:*:loadbalancer/app/*/*"
              ],
              "Condition": {
                "StringEquals": {
                  "elasticloadbalancing:CreateAction": [
                    "CreateTargetGroup",
                    "CreateLoadBalancer"
                  ]
                },
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:RegisterTargets",
                "elasticloadbalancing:DeregisterTargets"
              ],
              "Resource": "arn:${AWS::Partition}:elasticloadbalancing:*:*:targetgroup/*/*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:SetWebAcl",
                "elasticloadbalancing:ModifyListener",
                "elasticloadbalancing:AddListenerCertificates",
                "elasticloadbalancing:RemoveListenerCertificates",
                "elasticloadbalancing:ModifyRule",
                "elasticloadbalancing:SetRulePriorities"
              ],
              "Resource": "*"
            }
          ]
        }
  LoadBalancerControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: pods.eks.amazonaws.com }
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                aws:RequestTag/eks-cluster-name: !Ref ClusterName
                aws:RequestTag/kubernetes-namespace: kube-system
                aws:RequestTag/kubernetes-service-account: aws-load-balancer-controller
      ManagedPolicyArns:
        - !Ref LoadBalancerControllerPolicy
  LoadBalancerControllerPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref Cluster
      Namespace: kube-system
      ServiceAccount: aws-load-balancer-controller
      RoleArn: !GetAtt LoadBalancerControllerRole.Arn
Outputs:
  ClusterName:
    Value: !Ref Cluster
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ClusterEndpoint:
    Value: !GetAtt Cluster.Endpoint
  KubeconfigCommand:
    Value: !Sub "aws eks update-kubeconfig --region ${AWS::Region} --name ${ClusterName}"
  NatGatewayId:
    Value: !Ref NatGateway
  NatPublicIp:
    Value: !Ref NatEip
  ObservabilityPlacement:
    Value: "nodeSelector workload=observability; toleration dedicated=observability:NoSchedule"
  AppPlacement:
    Value: "nodeSelector workload=app"
  KarpenterNodeRoleArn:
    Value: !GetAtt KarpenterNodeRole.Arn
  KarpenterInstanceProfileName:
    Value: !Ref KarpenterNodeInstanceProfile
  KarpenterControllerRoleArn:
    Value: !GetAtt KarpenterControllerRole.Arn
  KarpenterSecurityGroupId:
    Value: !GetAtt Cluster.ClusterSecurityGroupId
  LoadBalancerControllerRoleArn:
    Value: !GetAtt LoadBalancerControllerRole.Arn
